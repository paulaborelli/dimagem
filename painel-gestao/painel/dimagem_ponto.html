// ── HELPERS ───────────────────────────────────────────────
function abrev(n){const p=n.trim().split(' ');return p.length<=2?n:p[0]+' '+p[p.length-1]}
function fmtH(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);return`${hh}h${mm>0?mm+'m':''}`}
let dA='todos',abaA='vg',charts={};

function mudarAba(id,el){
  abaA=id;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('vg').style.display=id==='vg'?'block':'none';
  document.getElementById('pt').style.display=id==='pt'?'block':'none';
  if(id==='pt') renderPont();
}
function filtrar(d,el){dA=d;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');destroyC();renderG()}
function getAll(d){if(d==='todos')return Object.entries(DADOS).flatMap(([k,v])=>v.map(f=>({...f,dept:k})));return(DADOS[d]||[]).map(f=>({...f,dept:d}))}
function destroyC(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={}}

function calcPont(nome){
  const dp=PONT[nome];if(!dp)return null;
  let ne=0,se=0,ns=0,ss=0;
  dp.dias.filter(d=>d.e1&&!d.obs?.includes('Férias')&&!d.obs?.includes('Falta')).forEach(d=>{
    const e=parse(d.e1),s=parse(d.s2);
    if(e!==null){ne+=e-dp.sch.e1;se++}
    if(s!==null){ns+=s-dp.sch.s2;ss++}
  });
  return{ae:se>0?ne/se:null,as:ss>0?ns/ss:null,n:se,dept:dp.dept,dias:dp.dias,sch:dp.sch}
}

// ── VISÃO GERAL ───────────────────────────────────────────
function renderG(){
  const fs=getAll(dA);
  renderKPI(fs);renderFer(fs);renderCh(fs);renderRk(fs);renderEm(fs);
}
function renderKPI(fs){
  const at=fs.filter(f=>!f.af);
  const tN=at.reduce((s,f)=>s+f.n,0),tF=fs.reduce((s,f)=>s+f.f,0),tE=at.reduce((s,f)=>s+f.e50+f.e100,0);
  document.getElementById('kpiS').innerHTML=`<p class="st">Resumo · 29/mai a 28/jun/2026</p><div class="kpi-grid">
    <div class="kpi a"><div class="kl">Horas Normais</div><div class="kv">${fmtH(tN)}</div><div class="ks">${at.length} ativos</div></div>
    <div class="kpi r"><div class="kl">Total Faltas</div><div class="kv">${fmtH(tF)}</div><div class="ks">${fs.filter(f=>f.f>0).length} com faltas</div></div>
    <div class="kpi l"><div class="kl">Horas Extras</div><div class="kv">${fmtH(tE)}</div><div class="ks">EX50% + EX100%</div></div>
    <div class="kpi x"><div class="kl">Em Férias</div><div class="kv">${fs.filter(f=>f.fer).length}</div><div class="ks">no período</div></div>
    <div class="kpi v"><div class="kl">Afastados</div><div class="kv">${fs.filter(f=>f.af).length}</div><div class="ks">funcionários</div></div>
  </div>`;
}
function renderFer(fs){
  const cf=fs.filter(f=>f.fer);
  document.getElementById('ferS').innerHTML=cf.length?`<p class="st">Férias no Período</p><div class="fg">${cf.map(f=>`<div class="fc"><div style="font-size:1.5rem">🏖️</div><div><div class="fn2">${abrev(f.nome)}</div><div class="fi">${f.dept} · ${f.fer}</div></div></div>`).join('')}</div>`:'';
}
function renderCh(fs){
  const at=fs.filter(f=>!f.af);
  document.getElementById('chS').innerHTML=`<p class="st">Horas Trabalhadas × Faltas × Extras</p><div class="cg full"><div class="cc">
    <div class="ch"><div><div class="ct">Horas Normais × Extras × Faltas</div><div class="cs">Funcionários ativos</div></div><span class="cb">${at.length} ativos</span></div>
    <div style="position:relative;height:${Math.max(220,at.length*28)}px"><canvas id="cH"></canvas></div>
  </div></div>`;
  setTimeout(()=>{charts.h=new Chart(document.getElementById('cH'),{type:'bar',data:{
    labels:at.map(f=>abrev(f.nome)),
    datasets:[{label:'Normais',data:at.map(f=>+f.n.toFixed(1)),backgroundColor:'#2E75B6CC',borderRadius:3},
              {label:'Extras',data:at.map(f=>+(f.e50+f.e100).toFixed(1)),backgroundColor:'#d97706CC',borderRadius:3},
              {label:'Faltas',data:at.map(f=>+f.f.toFixed(1)),backgroundColor:'#dc2626CC',borderRadius:3}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{family:'DM Sans',size:11},padding:12}}},
      scales:{x:{grid:{color:'#EBF3FB'},ticks:{font:{family:'DM Mono',size:10}}},y:{grid:{display:false},ticks:{font:{family:'DM Sans',size:11}}}}}});
  },50);
}
function renderRk(fs){
  const ce=fs.filter(f=>!f.af&&(f.e50+f.e100)>0).map(f=>({...f,tot:f.e50+f.e100})).sort((a,b)=>b.tot-a.tot);
  const mx=ce[0]?.tot||1;
  document.getElementById('rkS').innerHTML=`<p class="st">Ranking — Horas Extras</p><div class="cg">
    <div class="cc"><div class="ch"><div><div class="ct">Ranking Horas Extras</div></div><span class="cb">${ce.length} func.</span></div>
      <div class="rl">${ce.map((f,i)=>`<div class="ri"><div class="rn ${i===0?'g':i===1?'s':i===2?'b':''}">${i+1}</div><div style="flex:1"><div class="rname">${abrev(f.nome)}</div><div class="rdept">${f.dept}</div></div><div class="rbw"><div class="rbb"><div class="rbf" style="width:${Math.round(f.tot/mx*100)}%;background:var(--lr)"></div></div><div class="rv" style="color:var(--lr)">${fmtH(f.tot)}</div></div></div>`).join('')}</div>
    </div>
    <div class="cc"><div class="ch"><div><div class="ct">EX50% vs EX100%</div></div></div>
      <div style="position:relative;height:280px"><canvas id="cE"></canvas></div>
    </div>
  </div>`;
  setTimeout(()=>{const t8=ce.slice(0,8);charts.e=new Chart(document.getElementById('cE'),{type:'bar',data:{
    labels:t8.map(f=>abrev(f.nome)),
    datasets:[{label:'EX50%',data:t8.map(f=>+f.e50.toFixed(1)),backgroundColor:'#d97706CC',borderRadius:3},{label:'EX100%',data:t8.map(f=>+f.e100.toFixed(1)),backgroundColor:'#dc2626CC',borderRadius:3}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{family:'DM Sans',size:11}}}},
      scales:{x:{stacked:true,grid:{color:'#EBF3FB'},ticks:{font:{family:'DM Mono',size:10}}},y:{stacked:true,grid:{display:false},ticks:{font:{family:'DM Sans',size:10}}}}}});
  },50);
}
function renderEm(fs){
  const mx=Math.max(...fs.map(f=>f.n),1),mf=Math.max(...fs.map(f=>f.f),1),me=Math.max(...fs.map(f=>f.e50+f.e100),1);
  document.getElementById('emS').innerHTML=`<p class="st">Cartões por Funcionário</p><div class="eg">${fs.map(f=>{
    const ex=f.e50+f.e100;
    const bgs=[];
    if(f.fer) bgs.push(`<span class="badge bf">🏖️ ${f.fer}</span>`);
    if(f.af)  bgs.push(`<span class="badge ba">⚠️ Afastado(a)</span>`);
    if(f.obs&&!f.af) bgs.push(`<span class="badge bt">📋 ${f.obs}</span>`);
    if(!f.af&&f.f===0&&!f.obs) bgs.push(`<span class="badge bo">✓ Sem faltas</span>`);
    return`<div class="ec ${f.af?'af':''}">
      <div class="en">${abrev(f.nome)}</div>
      <div class="edp">${f.dept}${bgs.length?' · ':''}<span>${bgs.join('')}</span></div>
      <div class="eb">
        <div class="ebr"><div class="ebl">Normais</div><div class="ebb"><div class="ebf n" style="width:${Math.round(f.n/mx*100)}%"></div></div><div class="ebv">${fmtH(f.n)}</div></div>
        <div class="ebr"><div class="ebl">Extras</div><div class="ebb"><div class="ebf e" style="width:${Math.round(ex/me*100)}%"></div></div><div class="ebv">${fmtH(ex)}</div></div>
        <div class="ebr"><div class="ebl">Faltas</div><div class="ebb"><div class="ebf f" style="width:${Math.round(f.f/mf*100)}%"></div></div><div class="ebv">${fmtH(f.f)}</div></div>
      </div></div>`;
  }).join('')}</div>`;
}

// ── PONTUALIDADE ──────────────────────────────────────────
function renderPont(){
  const nomes=Object.keys(PONT);
  const mets=nomes.map(n=>({nome:n,...calcPont(n)})).filter(x=>x.n>0);
  const maxAe=Math.max(...mets.map(m=>Math.abs(m.ae||0)),1);
  const maxAs=Math.max(...mets.map(m=>Math.abs(m.as||0)),1);

  // Agrupa por dept
  const depts=[...new Set(mets.map(m=>m.dept))];

  document.getElementById('ptC').innerHTML=`
    <p class="st">Análise de Pontualidade — todos os departamentos · Jun/2026</p>
    <div class="info-box">💡 <strong>Como ler:</strong> Entrada negativa = antecipada (gera horas extras). Entrada positiva = atraso. Saída negativa = saída antecipada. Saída positiva = permanência além do horário.</div>
    <div class="cg">
      <div class="cc">
        <div class="ch"><div><div class="ct">Desvio Médio — Entrada</div><div class="cs">Negativo = antecipada · Positivo = atraso</div></div></div>
        <div style="position:relative;height:${Math.max(200,mets.length*28)}px"><canvas id="cEnt"></canvas></div>
      </div>
      <div class="cc">
        <div class="ch"><div><div class="ct">Desvio Médio — Saída</div><div class="cs">Negativo = saída antes · Positivo = além do horário</div></div></div>
        <div style="position:relative;height:${Math.max(200,mets.length*28)}px"><canvas id="cSai"></canvas></div>
      </div>
    </div>
    <p class="st">Detalhe Individual — clique para ver dia a dia</p>
    ${depts.map(d=>`
      <p style="font-size:.75rem;font-weight:600;color:var(--am);margin:.75rem 0 .5rem;text-transform:uppercase;letter-spacing:.08em">${d}</p>
      <div class="pg">${mets.filter(m=>m.dept===d).map(m=>{
        const ae=m.ae,as=m.as;
        const ecls=ae!==null&&ae<-3?'p-ee':ae!==null&&ae>3?'p-el':'p-n';
        const scls=as!==null&&as>3?'p-sl':as!==null&&as<-3?'p-se':'p-n';
        return`<div class="pc" onclick="abrirDet('${m.nome}')" id="pc_${m.nome.replace(/\s/g,'_').replace(/\./g,'')}">
          <div class="pn">${abrev(m.nome)}</div>
          <div class="pd">${m.n} dias · Horário: ${fmtT(PONT[m.nome].sch.e1)}–${fmtT(PONT[m.nome].sch.s2)}</div>
          <div class="pm">
            <div class="pmet ${ecls}"><div class="pmetv">${ae!==null?fmtDev(ae):'—'}</div><div class="pmetl">entrada</div></div>
            <div class="pmet ${scls}"><div class="pmetv">${as!==null?fmtDev(as):'—'}</div><div class="pmetl">saída</div></div>
          </div>
        </div>`;
      }).join('')}</div>
    `).join('')}
    <div class="dp" id="dPanel">
      <div class="dph"><div class="dpt" id="dTitle"></div><button class="dpc" onclick="fecharDet()">✕</button></div>
      <div id="dBody"></div>
    </div>`;

  setTimeout(()=>{
    const labels=mets.map(m=>abrev(m.nome));
    const ed=mets.map(m=>m.ae!==null?+m.ae.toFixed(1):0);
    const sd=mets.map(m=>m.as!==null?+m.as.toFixed(1):0);
    charts.ent=new Chart(document.getElementById('cEnt'),{type:'bar',data:{labels,datasets:[{label:'min',data:ed,backgroundColor:ed.map(v=>v<0?'#16a34a99':'#dc262699'),borderRadius:3}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{color:'#EBF3FB'},ticks:{font:{family:'DM Mono',size:10}}},y:{grid:{display:false},ticks:{font:{family:'DM Sans',size:10}}}}}});
    charts.sai=new Chart(document.getElementById('cSai'),{type:'bar',data:{labels,datasets:[{label:'min',data:sd,backgroundColor:sd.map(v=>v>0?'#7c3aed99':'#d9770699'),borderRadius:3}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{color:'#EBF3FB'},ticks:{font:{family:'DM Mono',size:10}}},y:{grid:{display:false},ticks:{font:{family:'DM Sans',size:10}}}}}});
  },50);
}

function abrirDet(nome){
  const dp=PONT[nome];if(!dp)return;
  document.querySelectorAll('.pc').forEach(c=>c.classList.remove('sel'));
  const card=document.getElementById('pc_'+nome.replace(/\s/g,'_').replace(/\./g,''));
  if(card){card.classList.add('sel');card.scrollIntoView({behavior:'smooth',block:'nearest'})}
  document.getElementById('dTitle').textContent=nome+' — Horário: '+fmtT(dp.sch.e1)+' – '+fmtT(dp.sch.s2);
  const html=dp.dias.map(d=>{
    if(d.obs==='Férias') return`<div class="dc fer"><div class="dd">${d.dt}</div><div style="font-size:.7rem;color:var(--rx)">🏖️ Férias</div></div>`;
    if(d.obs==='Falta')  return`<div class="dc aus"><div class="dd">${d.dt}</div><div style="font-size:.7rem;color:var(--vm)">⚠️ Falta</div></div>`;
    if(!d.e1)            return`<div class="dc aus"><div class="dd">${d.dt}</div><div style="font-size:.7rem;color:var(--sf)">${d.obs||'—'}</div></div>`;
    const e=parse(d.e1),s=parse(d.s2);
    const de=e!==null?e-dp.sch.e1:null,ds=s!==null?s-dp.sch.s2:null;
    const cls=de!==null&&de>5?'el':de!==null&&de<-5?'ee':'n';
    return`<div class="dc ${cls}">
      <div class="dd">${d.dt}${d.obs?` <small style="color:var(--vm)">(${d.obs})</small>`:''}</div>
      <div class="de"><span class="del">Entrada</span><span class="dev ${de!==null&&de>5?'dp-pos':de!==null&&de<-5?'dp-neg':'dp-zer'}">${d.e1} <small>(${de!==null?fmtDev(de):'—'})</small></span></div>
      <div class="de"><span class="del">Saída</span><span class="dev ${ds!==null&&ds>5?'dp-pos':ds!==null&&ds<-5?'dp-neg':'dp-zer'}">${d.s2||'—'} <small>(${ds!==null?fmtDev(ds):'—'})</small></span></div>
    </div>`;
  }).join('');
  document.getElementById('dBody').innerHTML=`<div class="dg">${html}</div>`;
  document.getElementById('dPanel').classList.add('open');
  document.getElementById('dPanel').scrollIntoView({behavior:'smooth',block:'start'});
}
function fecharDet(){document.getElementById('dPanel').classList.remove('open');document.querySelectorAll('.pc').forEach(c=>c.classList.remove('sel'))}
