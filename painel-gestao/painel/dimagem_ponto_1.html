<!DOCTYPE html>
<html lang="pt-BR">

<title>Dimagem — Dashboard de Ponto</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--azul:#1F3864;--azul-med:#2E75B6;--azul-clr:#BDD7EE;--azul-pale:#EBF3FB;--bg:#F4F7FC;--card:#FFFFFF;--border:#DDE6F0;--text:#1a2744;--soft:#5a7099;--verde:#16a34a;--verde-bg:#dcfce7;--verm:#dc2626;--verm-bg:#fee2e2;--laranja:#d97706;--lar-bg:#fef3c7;--roxo:#7c3aed;--roxo-bg:#ede9fe;--font:'DM Sans',sans-serif;--serif:'Libre Baskerville',serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;letter-spacing:.01em}
header{background:var(--azul);color:#fff;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(31,56,100,.2)}
.header-left{display:flex;align-items:center;gap:14px}
.logo{width:36px;height:36px;background:var(--azul-med);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.header-title{font-family:var(--serif);font-size:1rem;font-weight:700}
.header-sub{font-size:.73rem;opacity:.6}
.btn-voltar{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);border-radius:6px;padding:5px 12px;font-family:var(--font);font-size:.78rem;cursor:pointer;text-decoration:none;transition:all .2s}
.btn-voltar:hover{background:rgba(255,255,255,.2);color:#fff}
main{max-width:1300px;margin:0 auto;padding:2rem}

/* NAV TABS */
.nav-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:2rem;gap:0}
.nav-tab{padding:10px 20px;font-size:.85rem;font-weight:500;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.nav-tab:hover{color:var(--azul-med)}
.nav-tab.active{color:var(--azul);border-bottom-color:var(--azul);font-weight:600}

/* DEPT TABS */
.tabs{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:8px;font-size:.82rem;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--soft);transition:all .2s}
.tab:hover{border-color:var(--azul-med);color:var(--azul-med)}
.tab.active{background:var(--azul);color:#fff;border-color:var(--azul)}

.section-title{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--soft);margin:1.75rem 0 1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.kpi-card{background:var(--card);border-radius:12px;padding:1.1rem 1.25rem;border:1px solid var(--border);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(31,56,100,.08)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:12px 0 0 12px}
.kpi-card.azul::before{background:var(--azul-med)}.kpi-card.verde::before{background:var(--verde)}.kpi-card.verm::before{background:var(--verm)}.kpi-card.laranja::before{background:var(--laranja)}.kpi-card.roxo::before{background:var(--roxo)}
.kpi-label{font-size:.72rem;color:var(--soft);font-weight:500;margin-bottom:.35rem}
.kpi-value{font-size:1.8rem;font-weight:700;color:var(--azul);line-height:1;font-family:var(--mono)}
.kpi-sub{font-size:.68rem;color:var(--soft);margin-top:.25rem}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
.charts-grid.full{grid-template-columns:1fr}
@media(max-width:860px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:1.25rem 1.5rem}
.chart-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem}
.chart-title{font-size:.85rem;font-weight:600}
.chart-sub{font-size:.71rem;color:var(--soft);margin-top:2px}
.chart-badge{font-size:.7rem;font-weight:600;background:var(--azul-pale);color:var(--azul-med);padding:3px 8px;border-radius:20px;white-space:nowrap}

/* RANKING */
.ranking-list{display:flex;flex-direction:column;gap:.4rem}
.rank-item{display:flex;align-items:center;gap:.65rem;padding:.4rem .65rem;border-radius:8px;cursor:pointer;transition:background .15s}
.rank-item:hover{background:var(--azul-pale)}
.rank-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;flex-shrink:0;background:var(--azul-pale);color:var(--azul-med)}
.rank-num.gold{background:#FEF3C7;color:#D97706}.rank-num.silver{background:#F1F5F9;color:#64748B}.rank-num.bronze{background:#FEF0E7;color:#C2713A}
.rank-name{flex:1;font-size:.79rem;font-weight:500}
.rank-dept{font-size:.65rem;color:var(--soft)}
.rank-bar-wrap{flex:2;display:flex;align-items:center;gap:.45rem}
.rank-bar-bg{flex:1;height:5px;background:var(--azul-pale);border-radius:3px;overflow:hidden}
.rank-bar-fill{height:100%;border-radius:3px}
.rank-val{font-size:.74rem;font-weight:600;font-family:var(--mono);min-width:52px;text-align:right}

/* EMPLOYEE CARDS */
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.emp-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:1rem 1.25rem;transition:box-shadow .2s}
.emp-card:hover{box-shadow:0 4px 16px rgba(31,56,100,.08)}
.emp-card.afastado{opacity:.7;border-style:dashed}
.emp-name{font-size:.83rem;font-weight:600;color:var(--azul)}
.emp-cargo{font-size:.7rem;color:var(--soft);margin-top:1px;margin-bottom:.75rem}
.emp-bars{display:flex;flex-direction:column;gap:6px}
.emp-bar-row{display:flex;align-items:center;gap:8px}
.emp-bar-label{font-size:.68rem;color:var(--soft);width:52px;flex-shrink:0}
.emp-bar-bg{flex:1;height:6px;background:var(--azul-pale);border-radius:3px;overflow:hidden}
.emp-bar-fill{height:100%;border-radius:3px;transition:width .6s}
.emp-bar-fill.normais{background:var(--azul-med)}.emp-bar-fill.extras{background:var(--laranja)}.emp-bar-fill.faltas{background:var(--verm)}
.emp-bar-val{font-size:.68rem;font-family:var(--mono);min-width:38px;text-align:right}
.badge{font-size:.65rem;font-weight:600;padding:2px 7px;border-radius:10px;display:inline-block;margin:2px 2px 2px 0}
.badge-ferias{background:var(--roxo-bg);color:var(--roxo)}.badge-afasta{background:var(--verm-bg);color:var(--verm)}.badge-ok{background:var(--verde-bg);color:var(--verde)}.badge-atesta{background:var(--lar-bg);color:var(--laranja)}
.ferias-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
.ferias-card{background:var(--roxo-bg);border-radius:10px;border:1px solid rgba(124,58,237,.15);padding:.85rem 1rem;display:flex;align-items:center;gap:.75rem}
.ferias-icon{font-size:1.5rem;flex-shrink:0}
.ferias-nome{font-size:.82rem;font-weight:600;color:var(--roxo)}
.ferias-info{font-size:.7rem;color:#6d28d9;margin-top:2px}

/* PONTUALIDADE */
.pont-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
.pont-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:1.1rem 1.25rem;cursor:pointer;transition:all .2s}
.pont-card:hover{box-shadow:0 6px 20px rgba(31,56,100,.1);transform:translateY(-1px)}
.pont-card.selected{border-color:var(--azul-med);box-shadow:0 0 0 2px rgba(46,117,182,.2)}
.pont-emp-name{font-size:.82rem;font-weight:600;color:var(--azul);margin-bottom:.3rem}
.pont-emp-dept{font-size:.68rem;color:var(--soft);margin-bottom:.6rem}
.pont-metrics{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.pont-metric{text-align:center;padding:.35rem;border-radius:6px}
.pont-metric-val{font-size:.85rem;font-weight:700;font-family:var(--mono)}
.pont-metric-lbl{font-size:.6rem;color:var(--soft);margin-top:1px}
.pont-early{background:#dcfce7;}.pont-early .pont-metric-val{color:#15803d}
.pont-late{background:#fee2e2}.pont-late .pont-metric-val{color:#dc2626}
.pont-exit-early{background:#fef3c7}.pont-exit-early .pont-metric-val{color:#b45309}
.pont-exit-late{background:#ede9fe}.pont-exit-late .pont-metric-val{color:#7c3aed}

/* DETAIL MODAL */
.detail-panel{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:1.5rem;margin-top:1rem;display:none}
.detail-panel.open{display:block}
.detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.detail-title{font-size:1rem;font-weight:600;color:var(--azul)}
.detail-close{background:var(--azul-pale);border:none;color:var(--soft);font-size:1rem;width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem}
.day-card{border-radius:8px;padding:.5rem .65rem;border:1px solid var(--border)}
.day-date{font-size:.68rem;color:var(--soft);font-weight:500;margin-bottom:.3rem}
.day-entry{display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:1px}
.day-entry-lbl{color:var(--soft)}
.day-entry-val{font-family:var(--mono);font-weight:600}
.dev-pos{color:var(--verm)}.dev-neg{color:var(--verde)}.dev-zero{color:var(--soft)}
.day-card.normal{background:#f8fafc}.day-card.early-entry{background:#f0fdf4}.day-card.late-entry{background:#fef2f2}.day-card.ferias{background:var(--roxo-bg)}.day-card.ausente{background:#f8fafc;opacity:.5}
</style>
</head>

// ── HELPERS ───────────────────────────────────────────────
function abrev(n){const p=n.trim().split(' ');return p.length<=2?n:p[0]+' '+p[p.length-1]}
function fmtH(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);return `${hh}h${mm>0?mm+'m':''}`}
let deptAtual='todos', abaAtual='visao-geral', charts={}, empSelecionado=null;

function mudarAba(id, el){
  abaAtual=id;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('visao-geral').style.display=id==='visao-geral'?'block':'none';
  document.getElementById('pontualidade').style.display=id==='pontualidade'?'block':'none';
  if(id==='pontualidade') renderPontualidade();
}

function filtrar(dept, el){
  deptAtual=dept;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  destroyCharts(); renderGeral();
}

function getAllFuncs(dept){
  if(dept==='todos') return Object.entries(DADOS).flatMap(([d,fs])=>fs.map(f=>({...f,dept:d})));
  return (DADOS[dept]||[]).map(f=>({...f,dept}));
}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={}}

// ── PONTUALIDADE ──────────────────────────────────────────
function calcPont(nome, dept){
  const dp=PONT[dept]?.[nome]; if(!dp) return null;
  const sch=dp.sch; let ne=0,se=0,sx=0,ns=0;
  const diasCalc=dp.dias.filter(d=>d.e1&&!d.obs);
  diasCalc.forEach(d=>{
    const e=parse(d.e1), s=parse(d.s2);
    if(e!==null){ne+=e-sch.e1; se++;}
    if(s!==null){ns+=s-sch.s2; sx++;}
  });
  return {
    avgEntry: se>0? ne/se : null,
    avgExit:  sx>0? ns/sx : null,
    dias: dp.dias, sch,
    diasAnalisados: se
  };
}

function abrirDetalhe(nome, dept){
  const dp=PONT[dept]?.[nome]; if(!dp) return;
  document.querySelectorAll('.pont-card').forEach(c=>c.classList.remove('selected'));
  const card=document.getElementById('pc_'+nome.replace(/\s/g,'_'));
  if(card) card.classList.add('selected');
  document.getElementById('detailTitle').textContent=nome+' — Detalhe diário (Horário: '+fmtTime(dp.sch.e1)+' – '+fmtTime(dp.sch.s2)+')';
  document.getElementById('detailPanel').classList.add('open');

  const dias=dp.dias;
  const html=dias.map(d=>{
    if(d.obs==='Férias') return`<div class="day-card ferias"><div class="day-date">${d.dt}</div><div style="font-size:.7rem;color:var(--roxo)">🏖️ Férias</div></div>`;
    if(d.obs==='Falta')  return`<div class="day-card ausente"><div class="day-date">${d.dt}</div><div style="font-size:.7rem;color:var(--verm)">⚠️ Falta</div></div>`;
    if(!d.e1)            return`<div class="day-card ausente"><div class="day-date">${d.dt}</div><div style="font-size:.7rem;color:var(--soft)">—</div></div>`;

    const e=parse(d.e1), s=parse(d.s2);
    const de=e!==null? e-dp.sch.e1 : null;
    const ds=s!==null? s-dp.sch.s2 : null;
    const cls=de!==null&&de>5?'late-entry':de!==null&&de<-5?'early-entry':'normal';

    return`<div class="day-card ${cls}">
      <div class="day-date">${d.dt}${d.obs?` <small style="color:var(--verm)">(${d.obs})</small>`:''}</div>
      <div class="day-entry"><span class="day-entry-lbl">Entrada</span><span class="day-entry-val ${de!==null&&de>5?'dev-pos':de!==null&&de<-5?'dev-neg':'dev-zero'}">${d.e1} <small>(${de!==null?fmtDev(de):'—'})</small></span></div>
      <div class="day-entry"><span class="day-entry-lbl">Saída</span><span class="day-entry-val ${ds!==null&&ds>5?'dev-pos':ds!==null&&ds<-5?'dev-neg':'dev-zero'}">${d.s2||'—'} <small>(${ds!==null?fmtDev(ds):'—'})</small></span></div>
    </div>`;
  }).join('');

  document.getElementById('detailBody').innerHTML=`<div class="day-grid">${html}</div>`;
  document.getElementById('detailPanel').scrollIntoView({behavior:'smooth',block:'start'});
}

function fecharDetalhe(){
  document.getElementById('detailPanel').classList.remove('open');
  document.querySelectorAll('.pont-card').forEach(c=>c.classList.remove('selected'));
}

document.getElementById('deptTabs').innerHTML=depts.map((d,i)=>
  `<div class="tab ${i===0?'active':''}" onclick="filtrar('${d}',this)">${d==='todos'?'Todos':d}</div>`
).join('');
renderGeral();
</script>
