<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dimagem — Painel de Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --azul:       #1F3864;
  --azul-med:   #2E75B6;
  --azul-claro: #BDD7EE;
  --azul-pale:  #EBF3FB;
  --bg:         #F4F7FC;
  --card:       #FFFFFF;
  --border:     #DDE6F0;
  --text:       #1a2744;
  --soft:       #5a7099;
  --verde:      #16a34a;
  --verde-bg:   #dcfce7;
  --vermelho:   #dc2626;
  --verm-bg:    #fee2e2;
  --font:       'DM Sans', sans-serif;
  --mono:       'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; letter-spacing: .01em; }

/* HEADER */
header {
  background: var(--azul); color: #fff;
  padding: 0 2rem; display: flex; align-items: center;
  justify-content: space-between; height: 64px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(31,56,100,.2);
}
.header-left { display: flex; align-items: center; gap: 14px; }
.logo { width: 36px; height: 36px; background: var(--azul-med); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.header-title { font-size: 1rem; font-weight: 600; }
.header-sub   { font-size: .75rem; opacity: .6; }
.mes-selector { display: flex; gap: 5px; flex-wrap: wrap; }
.mes-btn { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.8); border-radius: 6px; padding: 5px 11px; font-family: var(--font); font-size: .78rem; cursor: pointer; transition: all .2s; }
.mes-btn:hover  { background: rgba(255,255,255,.2); color: #fff; }
.mes-btn.active { background: #fff; color: var(--azul); font-weight: 600; }
.mes-btn.vazio  { opacity: .35; cursor: default; }

/* LAYOUT */
main { max-width: 1400px; margin: 0 auto; padding: 2rem; }
.section-title { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--soft); margin: 2rem 0 1rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); }

/* KPIs */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.kpi-card { background: var(--card); border-radius: 12px; padding: 1.25rem 1.5rem; border: 1px solid var(--border); position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s; }
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(31,56,100,.08); }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--azul-med); border-radius: 12px 0 0 12px; }
.kpi-label { font-size: .73rem; color: var(--soft); font-weight: 500; margin-bottom: .4rem; }
.kpi-value { font-size: 1.9rem; font-weight: 700; color: var(--azul); line-height: 1; font-family: var(--mono); }
.kpi-sub   { font-size: .7rem; color: var(--soft); margin-top: .3rem; }

/* CHARTS GRID */
.charts-grid       { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; }
.charts-grid.wide  { grid-template-columns: 2fr 1fr; }
.charts-grid.full  { grid-template-columns: 1fr; }
@media(max-width:900px) { .charts-grid, .charts-grid.wide { grid-template-columns: 1fr; } }

.chart-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 1.25rem 1.5rem; transition: box-shadow .2s; }
.chart-card:hover { box-shadow: 0 4px 16px rgba(31,56,100,.07); }
.chart-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.25rem; }
.chart-title { font-size: .85rem; font-weight: 600; color: var(--text); }
.chart-sub   { font-size: .71rem; color: var(--soft); margin-top: 2px; }
.chart-badge { font-size: .7rem; font-weight: 600; background: var(--azul-pale); color: var(--azul-med); padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
.chart-wrap  { position: relative; }

/* RANKING */
.ranking-list { display: flex; flex-direction: column; gap: .45rem; }
.ranking-item { display: flex; align-items: center; gap: .75rem; padding: .45rem .75rem; border-radius: 8px; transition: background .15s; }
.ranking-item:hover { background: var(--azul-pale); }
.rank-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .68rem; font-weight: 700; flex-shrink: 0; background: var(--azul-pale); color: var(--azul-med); }
.rank-num.gold   { background: #FEF3C7; color: #D97706; }
.rank-num.silver { background: #F1F5F9; color: #64748B; }
.rank-num.bronze { background: #FEF0E7; color: #C2713A; }
.rank-name { flex: 1; font-size: .8rem; font-weight: 500; }
.rank-bar-wrap { flex: 2; display: flex; align-items: center; gap: .5rem; }
.rank-bar-bg   { flex: 1; height: 5px; background: var(--azul-pale); border-radius: 3px; overflow: hidden; }
.rank-bar-fill { height: 100%; background: var(--azul-med); border-radius: 3px; transition: width .6s ease; }
.rank-val { font-size: .76rem; font-weight: 600; color: var(--azul); font-family: var(--mono); min-width: 38px; text-align: right; }

/* TABELA */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .79rem; }
th { background: var(--azul-pale); color: var(--azul); font-weight: 600; padding: .55rem 1rem; text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; }
td { padding: .5rem 1rem; border-bottom: 1px solid var(--border); }
tr:hover td { background: var(--azul-pale); }
.td-num { font-family: var(--mono); font-weight: 500; text-align: right; }
.td-dif-pos { font-family: var(--mono); font-weight: 600; color: var(--verde); text-align: right; }
.td-dif-neg { font-family: var(--mono); font-weight: 600; color: var(--vermelho); text-align: right; }
.td-dif-zer { font-family: var(--mono); color: var(--soft); text-align: right; }
.td-bar { width: 80px; }
.mini-bar { height: 4px; background: var(--azul-pale); border-radius: 2px; overflow: hidden; }
.mini-bar-fill { height: 100%; background: var(--azul-med); border-radius: 2px; }

/* FORMAS */
.formas-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; margin-top: .75rem; }
.forma-card { background: var(--azul-pale); border-radius: 10px; padding: 1rem; text-align: center; }
.forma-icon  { font-size: 1.4rem; margin-bottom: .35rem; }
.forma-label { font-size: .73rem; color: var(--soft); font-weight: 500; }
.forma-val   { font-size: 1.4rem; font-weight: 700; color: var(--azul); font-family: var(--mono); }
.forma-pct   { font-size: .68rem; color: var(--soft); }

/* BADGE DIFERENÇA */
.dif-badge { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 600; padding: 2px 7px; border-radius: 12px; }
.dif-pos { background: var(--verde-bg); color: var(--verde); }
.dif-neg { background: var(--verm-bg); color: var(--vermelho); }
.dif-zer { background: var(--azul-pale); color: var(--soft); }

/* EMPTY */
.empty-state { text-align: center; padding: 3rem; color: var(--soft); }
.empty-state .icon { font-size: 2.5rem; margin-bottom: .75rem; }

/* VOLTAR */
.btn-voltar { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.85); border-radius: 6px; padding: 5px 12px; font-family: var(--font); font-size: .78rem; cursor: pointer; text-decoration: none; transition: all .2s; }
.btn-voltar:hover { background: rgba(255,255,255,.2); color: #fff; }
</style>
</head>

</header>

  const exSec = (data.examesCadastrados||[]).filter(e => e.secretaria && e.total > 0);
  const exames = ['Densitometria','Ecografia','Mamografia','Raio X','Ressonância','Tomografia'];
  charts.exSec = new Chart(document.getElementById('cExSec'), {
    type: 'bar',
    data: {
      labels: exSec.map(e => abrev(e.secretaria)),
      datasets: exames.map((ex,i) => ({ label: ex, data: exSec.map(e => e.exames[ex]||0), backgroundColor: CORES_EX[i]+'DD', borderRadius: 2 }))
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, padding: 10 } } }, scales: { x: { stacked: true, grid: { display: false }, ticks: { font: { family: 'DM Sans', size: 11 } } }, y: { stacked: true, grid: { color: '#EBF3FB' }, ticks: { font: { family: 'DM Mono', size: 10 } } } } }
  });
}

function iniciarMeses() {
  document.getElementById('mesSel').innerHTML = MESES.map(m =>
    `<button class="mes-btn ${m===mesSel?'active':''} ${!temDados(m)?'vazio':''}" onclick="mudarMes('${m}')" ${!temDados(m)?'title="Sem dados"':''}>${m.substring(0,3)}</button>`
  ).join('');
}

function mudarMes(mes) {
  mesSel = mes;
  iniciarMeses();
  renderPainel(mes);
}

iniciarMeses();
renderPainel(mesSel);
</script>
</body>
</html>
