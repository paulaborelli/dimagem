<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dimagem — Painel de Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --azul:       #1F3864;
  --azul-med:   #2E75B6;
  --azul-claro: #BDD7EE;
  --azul-pale:  #EBF3FB;
  --accent:     #2E75B6;
  --bg:         #F4F7FC;
  --card:       #FFFFFF;
  --border:     #DDE6F0;
  --text:       #1a2744;
  --text-soft:  #5a7099;
  --success:    #16a34a;
  --warn:       #d97706;
  --font:       'DM Sans', sans-serif;
  --mono:       'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ───────────────────────────────── */
header {
  background: var(--azul);
  color: #fff;
  padding: 0 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(31,56,100,.18);
}

.header-left { display: flex; align-items: center; gap: 14px; }
.logo-mark {
  width: 36px; height: 36px;
  background: var(--azul-med);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.header-title { font-size: 1rem; font-weight: 600; letter-spacing: .01em; }
.header-sub   { font-size: .75rem; opacity: .65; font-weight: 400; }

.mes-selector {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.mes-btn {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  color: rgba(255,255,255,.8);
  border-radius: 6px;
  padding: 5px 12px;
  font-family: var(--font);
  font-size: .8rem;
  cursor: pointer;
  transition: all .2s;
}
.mes-btn:hover   { background: rgba(255,255,255,.2); color: #fff; }
.mes-btn.active  { background: #fff; color: var(--azul); font-weight: 600; }
.mes-btn.vazio   { opacity: .4; cursor: default; }

/* ── LAYOUT ───────────────────────────────── */
main { max-width: 1400px; margin: 0 auto; padding: 2rem; }

.section-title {
  font-size: .7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--text-soft);
  margin: 2rem 0 1rem;
  padding-bottom: .5rem;
  border-bottom: 1px solid var(--border);
}

/* ── CARDS KPI ────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.kpi-card {
  background: var(--card);
  border-radius: 12px;
  padding: 1.25rem 1.5rem;
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(31,56,100,.08); }
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: var(--azul-med);
  border-radius: 12px 0 0 12px;
}

.kpi-label { font-size: .75rem; color: var(--text-soft); font-weight: 500; margin-bottom: .4rem; }
.kpi-value { font-size: 2rem; font-weight: 700; color: var(--azul); line-height: 1; }
.kpi-sub   { font-size: .72rem; color: var(--text-soft); margin-top: .3rem; }

/* ── GRID DE GRÁFICOS ─────────────────────── */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  margin-bottom: 1.25rem;
}
.charts-grid.wide { grid-template-columns: 2fr 1fr; }
.charts-grid.full { grid-template-columns: 1fr; }

@media (max-width: 900px) {
  .charts-grid, .charts-grid.wide { grid-template-columns: 1fr; }
}

.chart-card {
  background: var(--card);
  border-radius: 12px;
  border: 1px solid var(--border);
  padding: 1.25rem 1.5rem;
  transition: box-shadow .2s;
}
.chart-card:hover { box-shadow: 0 4px 16px rgba(31,56,100,.07); }

.chart-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 1.25rem;
}
.chart-title {
  font-size: .85rem;
  font-weight: 600;
  color: var(--text);
}
.chart-sub {
  font-size: .72rem;
  color: var(--text-soft);
  margin-top: 2px;
}
.chart-badge {
  font-size: .7rem;
  font-weight: 600;
  background: var(--azul-pale);
  color: var(--azul-med);
  padding: 3px 8px;
  border-radius: 20px;
}

.chart-wrap { position: relative; }

/* ── TABELA RANKING ───────────────────────── */
.ranking-list { display: flex; flex-direction: column; gap: .5rem; }
.ranking-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .5rem .75rem;
  border-radius: 8px;
  transition: background .15s;
}
.ranking-item:hover { background: var(--azul-pale); }
.rank-num {
  width: 22px; height: 22px;
  background: var(--azul-pale);
  color: var(--azul-med);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem;
  font-weight: 700;
  flex-shrink: 0;
}
.rank-num.gold   { background: #FEF3C7; color: #D97706; }
.rank-num.silver { background: #F1F5F9; color: #64748B; }
.rank-num.bronze { background: #FEF0E7; color: #C2713A; }

.rank-name { flex: 1; font-size: .82rem; font-weight: 500; }
.rank-bar-wrap { flex: 2; display: flex; align-items: center; gap: .5rem; }
.rank-bar-bg {
  flex: 1; height: 6px;
  background: var(--azul-pale);
  border-radius: 3px;
  overflow: hidden;
}
.rank-bar-fill {
  height: 100%;
  background: var(--azul-med);
  border-radius: 3px;
  transition: width .6s ease;
}
.rank-val { font-size: .78rem; font-weight: 600; color: var(--azul); font-family: var(--mono); min-width: 40px; text-align: right; }

/* ── TABELA CONVÊNIOS ─────────────────────── */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: .8rem;
}
th {
  background: var(--azul-pale);
  color: var(--azul);
  font-weight: 600;
  padding: .6rem 1rem;
  text-align: left;
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .05em;
}
td {
  padding: .55rem 1rem;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
tr:hover td { background: var(--azul-pale); }
.td-num { font-family: var(--mono); font-weight: 500; text-align: right; }
.td-bar { width: 100px; }
.mini-bar {
  height: 4px; background: var(--azul-pale);
  border-radius: 2px; overflow: hidden;
}
.mini-bar-fill { height: 100%; background: var(--azul-med); border-radius: 2px; }

/* ── FORMAS PILLS ─────────────────────────── */
.formas-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin-top: .5rem;
}
.forma-card {
  background: var(--azul-pale);
  border-radius: 10px;
  padding: 1rem;
  text-align: center;
}
.forma-icon { font-size: 1.5rem; margin-bottom: .4rem; }
.forma-label { font-size: .75rem; color: var(--text-soft); font-weight: 500; }
.forma-val   { font-size: 1.5rem; font-weight: 700; color: var(--azul); }
.forma-pct   { font-size: .7rem; color: var(--text-soft); }

/* ── VAZIO ────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 3rem;
  color: var(--text-soft);
}
.empty-state .icon { font-size: 2.5rem; margin-bottom: .75rem; }
.empty-state p { font-size: .85rem; }
</style>
</head>

    </div>
  </div>
  <div class="mes-selector" id="mesSelectorHeader"></div>
</header>

</main>

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const COR_SECUNDARIA = '#1F3864';
const CORES_EXAMES = ['#2E75B6','#4EAEE0','#1F3864','#7CB9E8','#B0D4F1','#5E9BD1'];
const CORES_FORMAS = ['#2E75B6','#1F3864','#7CB9E8'];

let mesSelecionado = 'Janeiro';
let charts = {};

// ── HELPERS ────────────────────────────────────────────────
function primeiroNome(nome) {
  return nome.trim().split(' ')[0];
}

function sobrenome(nome) {
  const parts = nome.trim().split(' ');
  return parts.length > 1 ? parts[parts.length - 1] : '';
}

function nomeAbrev(nome) {
  const parts = nome.trim().split(' ');
  if (parts.length === 1) return nome;
  return parts[0] + ' ' + parts[parts.length - 1];
}

function temDados(mes) {
  const d = DADOS[mes];
  if (!d) return false;
  return (d.agendamentos && d.agendamentos.length > 0) ||
         (d.procedimentos && d.procedimentos.length > 0);
}

function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
  charts = {};
}

// ── AGREGAÇÕES ─────────────────────────────────────────────
function calcularKPIs(data) {
  const totalAgend = data.agendamentos.reduce((s, a) => s + a.total, 0);
  const totalRealizados = data.resumoExames.reduce((s, e) => s + e.realizados, 0);
  const totalProc = data.procedimentos.reduce((s, p) => s + p.quantidade, 0);
  const taxaRealizacao = totalAgend > 0 ? Math.round(totalRealizados / totalAgend * 100) : 0;
  const totalFormas = data.formasAgendamento.reduce((s, f) => s + f.total, 0);
  return { totalAgend, totalRealizados, totalProc, taxaRealizacao, totalFormas };
}

function rankingSecretarias(data) {
  return data.procedimentos
    .filter(p => p.secretaria !== 'Secretária' && p.quantidade > 0)
    .sort((a, b) => b.quantidade - a.quantidade);
}

function totaisPorConvenio(data) {
  const convs = {};
  data.agendamentos.forEach(a => {
    Object.entries(a.convenios).forEach(([c, v]) => {
      convs[c] = (convs[c] || 0) + v;
    });
  });
  return Object.entries(convs)
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1]);
}

function totaisPorForma(data) {
  const formas = {};
  data.formasAgendamento.forEach(f => {
    Object.entries(f.formas).forEach(([forma, v]) => {
      formas[forma] = (formas[forma] || 0) + v;
    });
  });
  return formas;
}

function examesPorSecretaria(data) {
  const result = {};
  data.examesCadastrados.forEach(e => {
    if (e.secretaria && e.secretaria !== 'Secretária') {
      result[e.secretaria] = e;
    }
  });
  return result;
}

// ── RENDER ─────────────────────────────────────────────────
function renderPainel(mes) {
  destroyCharts();
  const data = DADOS[mes];
  const container = document.getElementById('painelConteudo');

  if (!data || !temDados(mes)) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>Nenhum dado lançado para <strong>${mes}</strong> ainda.</p>
      </div>`;
    return;

  const ranking = rankingSecretarias(data);
  const convenios = totaisPorConvenio(data);
  const formas = totaisPorForma(data);

    <!-- KPIs -->
    <p class="section-title">Resumo do Mês — ${mes} 2026</p>

        <div class="kpi-label">Procedimentos Agend.</div>

        <div class="kpi-sub">por secretárias</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Secretárias Ativas</div>
        <div class="kpi-value">${ranking.length}</div>
        <div class="kpi-sub">no período</div>
      </div>
    </div>

    <!-- Ranking + Exames -->

      <div class="chart-card">
        <div class="chart-header">

            <div class="chart-sub">Total por secretária no mês</div>
          </div>

        </div>

            <div class="ranking-item">

                  <div class="rank-bar-fill" style="width:${Math.round(r.quantidade/maxRanking*100)}%"></div>
                </div>
                <div class="rank-val">${r.quantidade.toLocaleString('pt-BR')}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <div>
            <div class="chart-title">Formas de Agendamento</div>
            <div class="chart-sub">Distribuição no mês</div>
          </div>
        </div>
        <div class="chart-wrap" style="height:180px">
          <canvas id="chartFormas"></canvas>

        </div>
      </div>
    </div>

    <!-- Exames -->
    <p class="section-title">Exames — Agendados × Realizados</p>

        <div class="chart-header">

        </div>

      <div class="chart-card">

          <div>

        </div>
        <div class="chart-wrap" style="height:260px">
          <canvas id="chartExamesPie"></canvas>

      </div>
    </div>

    <!-- Convênios -->
    <p class="section-title">Convênios</p>
    <div class="charts-grid wide">
      <div class="chart-card">
        <div class="chart-header">
          <div>
            <div class="chart-title">Agendamentos × Realizados por Convênio</div>
            <div class="chart-sub">Entrada diária consolidada</div>
          </div>
          <span class="chart-badge">${convenios.length} convênios</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Convênio</th>
                <th style="text-align:right">Agend.</th>
                <th style="text-align:right">Realiz.</th>
                <th style="text-align:right">Taxa</th>
                <th class="td-bar"></th>

            </thead>

              ${data.entradaDiaria.filter(e => e.agendados > 0 || e.realizados > 0).map(e => {

                const maxVal = Math.max(...data.entradaDiaria.map(x => x.agendados));
                return `
                  <tr>
                    <td>${e.convenio}</td>
                    <td class="td-num">${e.agendados.toLocaleString('pt-BR')}</td>
                    <td class="td-num">${e.realizados.toLocaleString('pt-BR')}</td>
                    <td class="td-num">${taxa}%</td>
                    <td class="td-bar">
                      <div class="mini-bar">
                        <div class="mini-bar-fill" style="width:${Math.round(e.agendados/maxVal*100)}%"></div>

              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <div>

        <div class="chart-wrap" style="height:300px">
          <canvas id="chartConvenios"></canvas>

    </div>

    <!-- Exames por secretária -->
    <p class="section-title">Exames Cadastrados por Secretária</p>
    <div class="charts-grid full">
      <div class="chart-card">

          </div>
        </div>
        <div class="chart-wrap" style="height:320px">
          <canvas id="chartExamesSec"></canvas>
        </div>
      </div>
    </div>
  `;

  // ── CHART: Formas ──
  charts.formas = new Chart(document.getElementById('chartFormas'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(formas),

  // ── CHART: Exames Agend x Realiz ──
  charts.exames = new Chart(document.getElementById('chartExames'), {
    type: 'bar',

      labels: data.resumoExames.map(e => e.exame),
      datasets: [
        {
          label: 'Agendados',
          data: data.resumoExames.map(e => e.agendados),
          backgroundColor: COR_PRINCIPAL + 'CC',
          borderRadius: 4
        },
        {
          label: 'Realizados',
          data: data.resumoExames.map(e => e.realizados),
          backgroundColor: COR_SECUNDARIA + 'CC',
          borderRadius: 4
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { family: 'DM Sans', size: 11 } } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'DM Sans', size: 11 } } },
        y: { grid: { color: '#EBF3FB' }, ticks: { font: { family: 'DM Mono', size: 10 } } }
      }
    }

  // ── CHART: Exames Pizza ──

    type: 'doughnut',
    data: {
      labels: data.resumoExames.map(e => e.exame),
      datasets: [{
        data: data.resumoExames.map(e => e.agendados),
        backgroundColor: CORES_EXAMES,
        borderWidth: 2,
        borderColor: '#fff'
      }]

    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, padding: 10 } } }
    }
  });

  // ── CHART: Top Convênios ──
  const topConv = convenios.slice(0, 8);
  charts.convenios = new Chart(document.getElementById('chartConvenios'), {
    type: 'bar',
    data: {
      labels: topConv.map(([c]) => c.length > 20 ? c.substring(0,18)+'…' : c),
      datasets: [{
        label: 'Agendamentos',
        data: topConv.map(([, v]) => v),
        backgroundColor: COR_PRINCIPAL + 'CC',

    options: {
      indexAxis: 'y',

      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#EBF3FB' }, ticks: { font: { family: 'DM Mono', size: 10 } } },

  // ── CHART: Exames por Secretária (stacked) ──
  const exSec = data.examesCadastrados.filter(e => e.secretaria && e.secretaria !== 'Secretária' && e.total > 0);
  const exames = ['Densitometria','Ecografia','Mamografia','Raio X','Ressonância','Tomografia'];
  charts.examesSec = new Chart(document.getElementById('chartExamesSec'), {
    type: 'bar',

      labels: exSec.map(e => nomeAbrev(e.secretaria)),
      datasets: exames.map((ex, i) => ({
        label: ex,
        data: exSec.map(e => e.exames[ex] || 0),

    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, padding: 10 } }
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { family: 'DM Sans', size: 11 } } },
        y: { stacked: true, grid: { color: '#EBF3FB' }, ticks: { font: { family: 'DM Mono', size: 10 } } }
      }
    }
  });
}

// ── INICIALIZAR SELETOR DE MESES ───────────────────────────
function inicializarMeses() {
  const container = document.getElementById('mesSelectorHeader');
  container.innerHTML = MESES.map(m => `
    <button
      class="mes-btn ${m === mesSelecionado ? 'active' : ''} ${!temDados(m) ? 'vazio' : ''}"
      onclick="selecionarMes('${m}')"
      ${!temDados(m) ? 'title="Sem dados lançados"' : ''}
    >${m.substring(0,3)}</button>
  `).join('');
}

function selecionarMes(mes) {
  mesSelecionado = mes;
  inicializarMeses();
  renderPainel(mes);
}

// ── BOOT ──────────────────────────────────────────────────
inicializarMeses();
renderPainel(mesSelecionado);
</script>
